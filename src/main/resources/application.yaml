spring:
  application:
    name: schim
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/schim}
    username: ${SPRING_DATASOURCE_USERNAME:schim}
    password: ${SPRING_DATASOURCE_PASSWORD:schim}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

r2:
  access-key: ${R2_ACCESS_KEY:}
  secret-key: ${R2_SECRET_KEY:}
  endpoint: ${R2_ENDPOINT:https://example.r2.cloudflarestorage.com}
  bucket: ${R2_BUCKET:schim}
  public-base-url: ${R2_PUBLIC_BASE_URL:https://example.com}